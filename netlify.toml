[build]
  command = "pip install -r requirements.txt"

[build.environment]
  PYTHON_VERSION = "3.13"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
